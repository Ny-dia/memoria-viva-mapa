name: Explorar fuentes (diagnóstico)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar víctimas SESNSP (SharePoint con cookies)
        run: |
          U='https://sspcgob-my.sharepoint.com/:u:/g/personal/cni_sspc_gob_mx/IQC7gjMDceDhTovbaLjJhCsPATp0-Oa3jyDBxpZ8qZm7Nkw?e=cNhRp0'
          for intento in a b c; do
            rm -f c.txt f.bin
            case $intento in
              a) curl -sL -A "Mozilla/5.0" -c c.txt -b c.txt "$U" -o /dev/null
                 curl -sL -A "Mozilla/5.0" -c c.txt -b c.txt -D h.txt "${U}&download=1" -o f.bin ;;
              b) curl -sL -A "Mozilla/5.0" -c c.txt -b c.txt -D h0.txt "$U" -o p.html
                 FIN=$(grep -i '^location' h0.txt | tail -1 | tr -d '\r' | cut -d' ' -f2)
                 echo "redirige a: $FIN"
                 ID=$(echo "$FIN" | grep -oE 'id=[^&]+' | head -1 | cut -d= -f2)
                 echo "id: $ID"
                 curl -sL -A "Mozilla/5.0" -c c.txt -b c.txt -D h.txt "https://sspcgob-my.sharepoint.com/personal/cni_sspc_gob_mx/_layouts/15/download.aspx?SourceUrl=$ID" -o f.bin ;;
              c) curl -sL -A "Mozilla/5.0" -D h.txt "$(echo "$U" | sed 's/?e=.*$//')?download=1" -o f.bin ;;
            esac
            echo "== intento $intento: $(grep -i '^content-type' h.txt | tail -1 | tr -d '\r') | $(stat -c%s f.bin) bytes"
            if unzip -l f.bin >/dev/null 2>&1; then unzip -l f.bin | head -6; break; fi
          done
