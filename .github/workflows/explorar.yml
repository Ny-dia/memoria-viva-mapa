name: Explorar fuentes (diagnóstico)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enlaces del SESNSP con su texto
        run: |
          pip install -q openpyxl pandas beautifulsoup4
          curl -sL -A "Mozilla/5.0" https://www.gob.mx/sesnsp/acciones-y-programas/datos-abiertos-de-incidencia-delictiva -o sesnsp.html
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          s = BeautifulSoup(open('sesnsp.html', encoding='utf-8'), 'html.parser')
          for a in s.find_all('a', href=True):
              if 'sharepoint' in a['href']:
                  prev = a.find_previous(['h2','h3','h4','strong','p','li'])
                  ctx = (prev.get_text(' ', strip=True)[:140] if prev else '')
                  print(f"[{a.get_text(' ', strip=True)[:60]}] <- {ctx}\n   {a['href']}")
          PY
      - name: Probar descargas de SharePoint
        run: |
          grep -oE 'https://sspcgob-my\.sharepoint\.com/[^"<> ]+' sesnsp.html | sed 's/&amp;/\&/g' | sort -u > links.txt
          while read u; do
            curl -sL -A "Mozilla/5.0" -o f.bin -D h.txt "${u}&download=1" || true
            tipo=$(grep -i '^content-type' h.txt | tail -1 | tr -d '\r')
            disp=$(grep -i '^content-disposition' h.txt | tail -1 | tr -d '\r')
            echo "== $u"
            echo "   $tipo | $(stat -c%s f.bin) bytes | $disp"
            if unzip -l f.bin >/dev/null 2>&1; then unzip -l f.bin | head -8; fi
          done < links.txt
      - name: Encabezado de población CONAPO
        run: |
          curl -sL -o conapo.zip https://conapo.segob.gob.mx/work/models/CONAPO/pry23/DB/ConDem50a19_ProyPob20a70.zip
          unzip -o -q conapo.zip 'ConDem50a19_ProyPob20a70/0_Pob_Mitad_1950_2070.xlsx'
          python3 - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook('ConDem50a19_ProyPob20a70/0_Pob_Mitad_1950_2070.xlsx', read_only=True)
          for ws in wb.worksheets:
              print('hoja', ws.title, ws.max_row, ws.max_column)
              for i, r in enumerate(ws.iter_rows(values_only=True)):
                  print(r)
                  if i > 5: break
          PY
