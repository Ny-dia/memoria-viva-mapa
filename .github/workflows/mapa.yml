name: Generar y publicar el mapa

# Actions → "Generar y publicar el mapa" → "Run workflow".
# Los enlaces ya vienen puestos; cámbialos solo si las fuentes publican archivos nuevos.
on:
  workflow_dispatch:
    inputs:
      urls_edr:
        description: "INEGI, EDR: enlaces de los .zip por año (separados por espacios o comas)"
        required: true
        default: "https://www.inegi.org.mx/contenidos/programas/edr/datosabiertos/defunciones/2023/conjunto_de_datos_defunciones_registradas_2023_csv.zip https://www.inegi.org.mx/contenidos/programas/edr/datosabiertos/defunciones/2024/conjunto_de_datos_edr2024_csv.zip https://www.inegi.org.mx/contenidos/programas/edr/datosabiertos/conjunto_de_datos_edr2025_csv.zip"
      url_sesnsp:
        description: "SESNSP: '2015 - 2025 (Fuero Común - Víctimas). Incidencia delictiva estatal'"
        required: true
        default: "https://sspcgob-my.sharepoint.com/:u:/g/personal/cni_sspc_gob_mx/IQC7gjMDceDhTovbaLjJhCsPATp0-Oa3jyDBxpZ8qZm7Nkw?e=cNhRp0"
      url_conapo:
        description: "CONAPO: Conciliación demográfica y proyecciones de población (zip)"
        required: true
        default: "https://conapo.segob.gob.mx/work/models/CONAPO/pry23/DB/ConDem50a19_ProyPob20a70.zip"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas openpyxl requests

      - name: Descargar datos
        env:
          URLS_EDR: ${{ inputs.urls_edr }}
          URL_SESNSP: ${{ inputs.url_sesnsp }}
          URL_CONAPO: ${{ inputs.url_conapo }}
        run: |
          python scripts/descargar.py datos_edr "$URLS_EDR"
          python scripts/descargar.py datos_sesnsp "$URL_SESNSP"
          python scripts/descargar.py datos_conapo "$URL_CONAPO"

      - name: Procesar las tres capas
        run: |
          python scripts/generar_mapa.py --edr datos_edr \
            --sesnsp "$(ls datos_sesnsp/*.zip | head -1)" \
            --conapo "$(ls datos_conapo/*.zip | head -1)" \
            --salida web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
